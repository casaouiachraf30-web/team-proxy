<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Achraf Napoli Shooter</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#030612;
  font-family:Arial,sans-serif;
  color:white;
}

canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
}

#top{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  font-weight:bold;
  font-size:17px;
  text-shadow:0 0 10px #00eaff;
}

#name{
  position:fixed;
  top:48px;
  left:50%;
  transform:translateX(-50%);
  color:#00eaff;
  font-size:16px;
  font-weight:bold;
  text-shadow:0 0 12px #00eaff;
  z-index:5;
}

#controls{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  z-index:10;
}

.side{
  display:flex;
  gap:12px;
}

.btn{
  width:70px;
  height:70px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  color:white;
  background:rgba(0,170,255,.22);
  border:2px solid #00cfff;
  box-shadow:0 0 18px rgba(0,200,255,.7);
  user-select:none;
}

#fire{
  width:88px;
  height:88px;
  background:rgba(255,40,70,.25);
  border-color:#ff315a;
  box-shadow:0 0 22px rgba(255,40,70,.8);
  font-size:35px;
}

#gameOver{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.82);
  z-index:20;
}

#gameOver h1{
  color:#ff315a;
  font-size:42px;
  text-shadow:0 0 20px #ff315a;
  margin-bottom:12px;
}

#finalScore{
  font-size:22px;
  margin-bottom:25px;
}

#restart{
  padding:14px 30px;
  border:0;
  border-radius:12px;
  background:#00aaff;
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 0 20px #00aaff;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="top">
  <div>⭐ SCORE: <span id="score">0</span></div>
  <div>❤️ HP: <span id="hp">100</span></div>
</div>

<div id="name">ACHRAF_NAPOLI</div>

<div id="controls">

  <div class="side">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>

  <div class="btn" id="fire">🔥</div>

</div>

<div id="gameOver">

  <h1>GAME OVER</h1>

  <div id="finalScore">
    Score: 0
  </div>

  <button id="restart">
    RESTART
  </button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize",resize);

let player;
let bullets=[];
let enemies=[];
let particles=[];

let score=0;
let hp=100;
let running=true;

const keys={
  left:false,
  right:false,
  fire:false
};

function createPlayer(){

  player={
    x:canvas.width/2,
    y:canvas.height-135,
    speed:7,
    cooldown:0
  };

}

createPlayer();


function shoot(){

  if(!running) return;

  if(player.cooldown<=0){

    bullets.push({
      x:player.x,
      y:player.y-30,
      speed:11,
      radius:5
    });

    player.cooldown=10;
  }

}


function spawnEnemy(){

  if(!running)return;

  enemies.push({

    x:Math.random()*(canvas.width-60)+30,
    y:-40,
    size:32+Math.random()*18,
    speed:1.5+Math.random()*2.5

  });

}


setInterval(spawnEnemy,700);


function explosion(x,y){

  for(let i=0;i<18;i++){

    particles.push({

      x:x,
      y:y,

      vx:(Math.random()-.5)*8,
      vy:(Math.random()-.5)*8,

      life:35+Math.random()*20

    });

  }

}


function update(){

  if(!running)return;

  if(keys.left)
    player.x-=player.speed;

  if(keys.right)
    player.x+=player.speed;

  player.x=Math.max(25,Math.min(canvas.width-25,player.x));

  if(player.cooldown>0)
    player.cooldown--;

  if(keys.fire)
    shoot();


  bullets.forEach(b=>{
    b.y-=b.speed;
  });

  bullets=bullets.filter(b=>b.y>-30);


  enemies.forEach(e=>{
    e.y+=e.speed;
  });


  // Collision bullets / enemies

  for(let i=enemies.length-1;i>=0;i--){

    let e=enemies[i];

    for(let j=bullets.length-1;j>=0;j--){

      let b=bullets[j];

      let dx=e.x-b.x;
      let dy=e.y-b.y;

      let distance=Math.sqrt(dx*dx+dy*dy);

      if(distance<e.size/2+b.radius){

        explosion(e.x,e.y);

        enemies.splice(i,1);
        bullets.splice(j,1);

        score+=10;

        document.getElementById("score").textContent=score;

        break;
      }

    }

  }


  // Enemy reaches bottom

  for(let i=enemies.length-1;i>=0;i--){

    let e=enemies[i];

    if(e.y>canvas.height-90){

      enemies.splice(i,1);

      hp-=20;

      if(hp<0)hp=0;

      document.getElementById("hp").textContent=hp;

      if(hp<=0)
        endGame();

    }

  }


  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

  });

  particles=particles.filter(p=>p.life>0);

}


function drawBackground(){

  ctx.fillStyle="#030612";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  // Stars

  for(let i=0;i<90;i++){

    let x=(i*97)%canvas.width;

    let y=(i*61+Date.now()*.025)%canvas.height;

    ctx.fillStyle="rgba(255,255,255,.5)";

    ctx.fillRect(x,y,2,2);

  }

}


function drawPlayer(){

  ctx.save();

  ctx.translate(player.x,player.y);

  ctx.shadowBlur=25;
  ctx.shadowColor="#00eaff";

  ctx.fillStyle="#00eaff";

  ctx.beginPath();

  ctx.moveTo(0,-30);
  ctx.lineTo(-27,25);
  ctx.lineTo(0,14);
  ctx.lineTo(27,25);

  ctx.closePath();

  ctx.fill();


  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(0,-8,7,0,Math.PI*2);

  ctx.fill();

  ctx.restore();

}


function drawBullets(){

  bullets.forEach(b=>{

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.radius,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#fff700";

    ctx.shadowBlur=15;
    ctx.shadowColor="#fff700";

    ctx.fill();

    ctx.shadowBlur=0;

  });

}


function drawEnemies(){

  enemies.forEach(e=>{

    ctx.save();

    ctx.translate(e.x,e.y);

    ctx.shadowBlur=18;
    ctx.shadowColor="#ff315a";

    ctx.fillStyle="#ff315a";

    ctx.beginPath();

    for(let i=0;i<6;i++){

      let angle=i*Math.PI/3;

      let x=Math.cos(angle)*e.size/2;
      let y=Math.sin(angle)*e.size/2;

      if(i===0)
        ctx.moveTo(x,y);
      else
        ctx.lineTo(x,y);

    }

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(-7,-4,4,0,Math.PI*2);
    ctx.arc(7,-4,4,0,Math.PI*2);

    ctx.fill();

    ctx.restore();

  });

}


function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=p.life/55;

    ctx.fillStyle="#ffaa00";

    ctx.beginPath();

    ctx.arc(p.x,p.y,3,0,Math.PI*2);

    ctx.fill();

  });

  ctx.globalAlpha=1;

}


function draw(){

  drawBackground();

  drawBullets();

  drawEnemies();

  drawPlayer();

  drawParticles();

}


function endGame(){

  running=false;

  document.getElementById("finalScore").textContent=
    "ACHRAF_NAPOLI • Score: "+score;

  document.getElementById("gameOver").style.display="flex";

}


function restartGame(){

  score=0;
  hp=100;

  bullets=[];
  enemies=[];
  particles=[];

  createPlayer();

  document.getElementById("score").textContent="0";
  document.getElementById("hp").textContent="100";

  document.getElementById("gameOver").style.display="none";

  running=true;

}


function holdButton(element,key){

  element.addEventListener("touchstart",e=>{

    e.preventDefault();

    keys[key]=true;

  });

  element.addEventListener("touchend",e=>{

    e.preventDefault();

    keys[key]=false;

  });

  element.addEventListener("touchcancel",()=>{

    keys[key]=false;

  });


  element.addEventListener("mousedown",()=>{

    keys[key]=true;

  });

  element.addEventListener("mouseup",()=>{

    keys[key]=false;

  });

  element.addEventListener("mouseleave",()=>{

    keys[key]=false;

  });

}


holdButton(
  document.getElementById("left"),
  "left"
);

holdButton(
  document.getElementById("right"),
  "right"
);

holdButton(
  document.getElementById("fire"),
  "fire"
);


document.getElementById("restart")
.addEventListener("click",restartGame);


document.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
    keys.left=true;

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
    keys.right=true;

  if(e.code==="Space")
    keys.fire=true;

});


document.addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
    keys.left=false;

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
    keys.right=false;

  if(e.code==="Space")
    keys.fire=false;

});


function loop(){

  update();
  draw();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
