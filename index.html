<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ACHRAF_NAPOLI - SHOOTER</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  overflow:hidden;
  background:#02040d;
  color:white;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at center,#10234d 0%,#02040d 70%);
  text-align:center;
}

.hidden{
  display:none!important;
}

.logo{
  font-size:38px;
  font-weight:900;
  color:#00eaff;
  text-shadow:0 0 12px #00eaff,0 0 35px #0077ff;
  margin-bottom:8px;
}

.subtitle{
  color:#a9cfff;
  margin-bottom:30px;
  letter-spacing:3px;
}

.menuBtn{
  width:220px;
  margin:8px;
  padding:15px;
  border:2px solid #00cfff;
  border-radius:14px;
  background:rgba(0,170,255,.15);
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 0 18px rgba(0,200,255,.45);
}

#stageScreen{
  padding:20px;
}

.stageTitle{
  font-size:30px;
  color:#00eaff;
  margin-bottom:20px;
  text-shadow:0 0 15px #00eaff;
}

.stages{
  width:min(390px,92vw);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stageBtn{
  height:80px;
  border:2px solid #198cff;
  border-radius:14px;
  background:#08152c;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.stageBtn.locked{
  opacity:.35;
  border-color:#555;
}

#hud{
  position:fixed;
  z-index:8;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:16px;
  text-shadow:0 0 8px #00eaff;
}

#playerName{
  position:fixed;
  z-index:8;
  top:43px;
  left:50%;
  transform:translateX(-50%);
  color:#00eaff;
  font-weight:bold;
  font-size:14px;
  letter-spacing:2px;
}

#stageText{
  position:fixed;
  z-index:8;
  top:66px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-size:13px;
}

#controls{
  position:fixed;
  z-index:10;
  bottom:18px;
  left:0;
  right:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.controlGroup{
  display:flex;
  gap:10px;
}

.control{
  width:68px;
  height:68px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #00cfff;
  background:rgba(0,180,255,.18);
  box-shadow:0 0 18px rgba(0,200,255,.6);
  font-size:27px;
  font-weight:bold;
}

#fire{
  width:86px;
  height:86px;
  border-color:#ff315a;
  background:rgba(255,40,70,.2);
  box-shadow:0 0 22px rgba(255,40,70,.7);
  font-size:34px;
}

#gameOver,#stageComplete{
  background:rgba(0,0,0,.86);
}

.bigTitle{
  font-size:42px;
  color:#ff315a;
  text-shadow:0 0 20px #ff315a;
  margin-bottom:15px;
}

.completeTitle{
  color:#00ff9d;
  text-shadow:0 0 20px #00ff9d;
}

.info{
  font-size:20px;
  margin-bottom:22px;
}

.smallBtn{
  padding:13px 25px;
  border:0;
  border-radius:12px;
  background:#00aaff;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin:5px;
}

#bossBar{
  position:fixed;
  z-index:9;
  top:88px;
  left:15%;
  right:15%;
  height:13px;
  border:2px solid #ff315a;
  border-radius:20px;
  overflow:hidden;
  display:none;
}

#bossHealth{
  width:100%;
  height:100%;
  background:#ff315a;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MAIN MENU -->
<div id="menu" class="screen">

  <div class="logo">ACHRAF_NAPOLI</div>

  <div class="subtitle">SPACE SHOOTER</div>

  <button class="menuBtn" id="playBtn">▶ PLAY</button>

  <button class="menuBtn" id="stagesBtn">⚡ STAGES</button>

</div>

<!-- STAGE SELECT -->
<div id="stageScreen" class="screen hidden">

  <div class="stageTitle">SELECT STAGE</div>

  <div class="stages" id="stages"></div>

  <button class="menuBtn" id="backBtn">← BACK</button>

</div>

<!-- HUD -->
<div id="hud" class="hidden">

  <div>⭐ <span id="score">0</span></div>

  <div>❤️ <span id="hp">100</span></div>

</div>

<div id="playerName" class="hidden">
  ACHRAF_NAPOLI
</div>

<div id="stageText" class="hidden">
  STAGE 1
</div>

<!-- BOSS BAR -->
<div id="bossBar">
  <div id="bossHealth"></div>
</div>

<!-- CONTROLS -->
<div id="controls" class="hidden">

  <div class="controlGroup">

    <div class="control" id="left">◀</div>

    <div class="control" id="right">▶</div>

  </div>

  <div class="control" id="fire">🔥</div>

</div>

<!-- GAME OVER -->
<div id="gameOver" class="screen hidden">

  <div class="bigTitle">GAME OVER</div>

  <div class="info">
    SCORE: <span id="finalScore">0</span>
  </div>

  <button class="smallBtn" id="retryBtn">
    🔄 RETRY
  </button>

  <button class="smallBtn" id="menuBtn">
    🏠 MENU
  </button>

</div>

<!-- STAGE COMPLETE -->
<div id="stageComplete" class="screen hidden">

  <div class="bigTitle completeTitle">
    STAGE COMPLETE!
  </div>

  <div class="info">
    ⭐ SCORE: <span id="completeScore">0</span>
  </div>

  <button class="smallBtn" id="nextBtn">
    ▶ NEXT STAGE
  </button>

  <button class="smallBtn" id="stageMenuBtn">
    ⚡ STAGES
  </button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){

  canvas.width=innerWidth;
  canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);


/* GAME DATA */

let unlocked=1;
let currentStage=1;

let player;
let bullets=[];
let enemies=[];
let particles=[];

let score=0;
let hp=100;

let running=false;
let spawnTimer=0;
let enemiesKilled=0;

let boss=null;

const keys={
  left:false,
  right:false,
  fire:false
};


/* STAGE SETTINGS */

const stageData={

  1:{
    enemies:10,
    speed:1.5,
    boss:false
  },

  2:{
    enemies:15,
    speed:2,
    boss:false
  },

  3:{
    enemies:20,
    speed:2.4,
    boss:false
  },

  4:{
    enemies:25,
    speed:2.8,
    boss:true
  },

  5:{
    enemies:32,
    speed:3.2,
    boss:true
  },

  6:{
    enemies:40,
    speed:3.6,
    boss:true
  }

};


/* ELEMENTS */

const menu=document.getElementById("menu");
const stageScreen=document.getElementById("stageScreen");
const gameOver=document.getElementById("gameOver");
const stageComplete=document.getElementById("stageComplete");

const hud=document.getElementById("hud");
const controls=document.getElementById("controls");
const playerName=document.getElementById("playerName");
const stageText=document.getElementById("stageText");


/* STAGE BUTTONS */

function createStages(){

  const container=document.getElementById("stages");

  container.innerHTML="";

  for(let i=1;i<=6;i++){

    const button=document.createElement("button");

    button.className="stageBtn";

    if(i>unlocked){

      button.classList.add("locked");

      button.innerHTML="🔒<br>STAGE "+i;

      button.disabled=true;

    }else{

      button.innerHTML="⚡<br>STAGE "+i;

      button.onclick=()=>startStage(i);

    }

    container.appendChild(button);

  }

}

createStages();


/* MENU */

document.getElementById("playBtn").onclick=()=>{

  startStage(unlocked);

};

document.getElementById("stagesBtn").onclick=()=>{

  menu.classList.add("hidden");

  stageScreen.classList.remove("hidden");

  createStages();

};

document.getElementById("backBtn").onclick=()=>{

  stageScreen.classList.add("hidden");

  menu.classList.remove("hidden");

};


/* START GAME */

function startStage(stage){

  currentStage=stage;

  score=0;
  hp=100;

  bullets=[];
  enemies=[];
  particles=[];

  boss=null;

  enemiesKilled=0;

  spawnTimer=0;

  player={

    x:canvas.width/2,

    y:canvas.height-135,

    speed:7,

    cooldown:0

  };

  menu.classList.add("hidden");
  stageScreen.classList.add("hidden");
  gameOver.classList.add("hidden");
  stageComplete.classList.add("hidden");

  hud.classList.remove("hidden");
  controls.classList.remove("hidden");
  playerName.classList.remove("hidden");
  stageText.classList.remove("hidden");

  stageText.textContent="STAGE "+stage;

  document.getElementById("score").textContent="0";
  document.getElementById("hp").textContent="100";

  running=true;

  document.getElementById("bossBar").style.display="none";

}


/* SHOOT */

function shoot(){

  if(!running)return;

  if(player.cooldown<=0){

    bullets.push({

      x:player.x,

      y:player.y-30,

      speed:11,

      radius:5

    });

    player.cooldown=9;

  }

}


/* SPAWN ENEMY */

function spawnEnemy(){

  const data=stageData[currentStage];

  if(enemiesKilled>=data.enemies)return;

  enemies.push({

    x:Math.random()*(canvas.width-60)+30,

    y:-45,

    size:30+Math.random()*18,

    speed:data.speed+Math.random()*1.3

  });

}


/* BOSS */

function createBoss(){

  if(!stageData[currentStage].boss)return;

  boss={

    x:canvas.width/2,

    y:-90,

    size:90,

    health:100+currentStage*50,

    maxHealth:100+currentStage*50,

    speed:1.2

  };

  document.getElementById("bossBar").style.display="block";

}


/* EXPLOSION */

function explosion(x,y){

  for(let i=0;i<20;i++){

    particles.push({

      x:x,

      y:y,

      vx:(Math.random()-.5)*8,

      vy:(Math.random()-.5)*8,

      life:25+Math.random()*35

    });

  }

}


/* UPDATE */

function update(){

  if(!running)return;


  const data=stageData[currentStage];


  /* PLAYER */

  if(keys.left)
    player.x-=player.speed;

  if(keys.right)
    player.x+=player.speed;

  player.x=Math.max(25,Math.min(canvas.width-25,player.x));


  if(player.cooldown>0)
    player.cooldown--;

  if(keys.fire)
    shoot();


  /* SPAWN */

  spawnTimer--;

  if(spawnTimer<=0){

    spawnEnemy();

    spawnTimer=Math.max(
      25,
      70-currentStage*6
    );

  }


  /* BULLETS */

  bullets.forEach(b=>{

    b.y-=b.speed;

  });

  bullets=bullets.filter(b=>b.y>-30);


  /* ENEMIES */

  enemies.forEach(e=>{

    e.y+=e.speed;

  });


  /* BULLET COLLISIONS */

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    for(let j=bullets.length-1;j>=0;j--){

      const b=bullets[j];

      const dx=e.x-b.x;
      const dy=e.y-b.y;

      const distance=Math.sqrt(dx*dx+dy*dy);

      if(distance<e.size/2+b.radius){

        explosion(e.x,e.y);

        enemies.splice(i,1);

        bullets.splice(j,1);

        score+=10;

        enemiesKilled++;

        document.getElementById("score").textContent=score;

        break;

      }

    }

  }


  /* ENEMY REACHES PLAYER */

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    if(e.y>canvas.height-85){

      enemies.splice(i,1);

      hp-=20;

      if(hp<0)hp=0;

      document.getElementById("hp").textContent=hp;

      if(hp<=0){

        endGame();

        return;

      }

    }

  }


  /* BOSS */

  if(
    data.boss &&
    enemiesKilled>=data.enemies &&
    !boss
  ){

    createBoss();

  }


  if(boss){

    if(boss.y<130)
      boss.y+=boss.speed;


    boss.x+=Math.sin(Date.now()/700)*2;


    for(let i=bullets.length-1;i>=0;i--){

      const b=bullets[i];

      const dx=b.x-boss.x;
      const dy=b.y-boss.y;

      const distance=Math.sqrt(dx*dx+dy*dy);

      if(distance<boss.size/2+b.radius){

        bullets.splice(i,1);

        boss.health-=5;

        const percent=
          Math.max(0,boss.health/boss.maxHealth)*100;

        document.getElementById(
          "bossHealth"
        ).style.width=percent+"%";


        if(boss.health<=0){

          explosion(boss.x,boss.y);

          boss=null;

          document.getElementById(
            "bossBar"
          ).style.display="none";

          score+=100;

          completeStage();

          return;

        }

      }

    }

  }


  /* STAGE WITHOUT BOSS */

  if(
    !data.boss &&
    enemiesKilled>=data.enemies &&
    enemies.length===0
  ){

    completeStage();

    return;

  }


  /* PARTICLES */

  particles.forEach(p=>{

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

  });

  particles=particles.filter(
    p=>p.life>0
  );

}


/* DRAW BACKGROUND */

function drawBackground(){

  ctx.fillStyle="#02040d";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  for(let i=0;i<100;i++){

    const x=(i*97)%canvas.width;

    const y=
      (i*61+Date.now()*.025)
      %canvas.height;

    ctx.fillStyle="rgba(255,255,255,.55)";

    ctx.fillRect(x,y,2,2);

  }

}


/* DRAW PLAYER */

function drawPlayer(){

  if(!player)return;

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.shadowBlur=25;
  ctx.shadowColor="#00eaff";

  ctx.fillStyle="#00eaff";

  ctx.beginPath();

  ctx.moveTo(0,-32);

  ctx.lineTo(-28,25);

  ctx.lineTo(0,14);

  ctx.lineTo(28,25);

  ctx.closePath();

  ctx.fill();


  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    0,
    -8,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* DRAW BULLETS */

function drawBullets(){

  bullets.forEach(b=>{

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.radius,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#fff700";

    ctx.shadowBlur=18;
    ctx.shadowColor="#fff700";

    ctx.fill();

    ctx.shadowBlur=0;

  });

}


/* DRAW ENEMIES */

function drawEnemies(){

  enemies.forEach(e=>{

    ctx.save();

    ctx.translate(e.x,e.y);

    ctx.shadowBlur=18;
    ctx.shadowColor="#ff315a";

    ctx.fillStyle="#ff315a";

    ctx.beginPath();

    for(let i=0;i<6;i++){

      const angle=i*Math.PI/3;

      const x=
        Math.cos(angle)*e.size/2;

      const y=
        Math.sin(angle)*e.size/2;

      if(i===0)
        ctx.moveTo(x,y);
      else
        ctx.lineTo(x,y);

    }

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(-7,-4,4,0,Math.PI*2);

    ctx.arc(7,-4,4,0,Math.PI*2);

    ctx.fill();

    ctx.restore();

  });

}


/* DRAW BOSS */

function drawBoss(){

  if(!boss)return;

  ctx.save();

  ctx.translate(
    boss.x,
    boss.y
  );

  ctx.shadowBlur=30;
  ctx.shadowColor="#b000ff";

  ctx.fillStyle="#8b00ff";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    boss.size/2,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#ff315a";

  ctx.beginPath();

  ctx.arc(
    -18,
    -10,
    8,
    0,
    Math.PI*2
  );

  ctx.arc(
    18,
    -10,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* PARTICLES */

function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=
      p.life/60;

    ctx.fillStyle="#ffaa00";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.globalAlpha=1;

}


/* DRAW */

function draw(){

  drawBackground();

  drawBullets();

  drawEnemies();

  drawBoss();

  drawPlayer();

  drawParticles();

}


/* GAME OVER */

function endGame(){

  running=false;

  hud.classList.add("hidden");
  controls.classList.add("hidden");
  playerName.classList.add("hidden");
  stageText.classList.add("hidden");

  document.getElementById(
    "finalScore"
  ).textContent=score;

  gameOver.classList.remove("hidden");

}


/* COMPLETE */

function completeStage(){

  running=false;

  hud.classList.add("hidden");
  controls.classList.add("hidden");
  playerName.classList.add("hidden");
  stageText.classList.add("hidden");

  if(currentStage>=unlocked){

    unlocked=Math.min(
      6,
      currentStage+1
    );

  }

  document.getElementById(
    "completeScore"
  ).textContent=score;

  stageComplete.classList.remove(
    "hidden"
  );

}


/* RETRY */

document.getElementById("retryBtn").onclick=()=>{

  startStage(currentStage);

};


/* MENU */

document.getElementById("menuBtn").onclick=()=>{

  gameOver.classList.add("hidden");

  hud.classList.add("hidden");
  controls.classList.add("hidden");

  menu.classList.remove("hidden");

};


/* NEXT */

document.getElementById("nextBtn").onclick=()=>{

  if(currentStage<6){

    startStage(
      currentStage+1
    );

  }else{

    stageComplete.classList.add("hidden");

    stageScreen.classList.remove(
      "hidden"
    );

    createStages();

  }

};


/* STAGE MENU */

document.getElementById(
  "stageMenuBtn"
).onclick=()=>{

  stageComplete.classList.add(
    "hidden"
  );

  stageScreen.classList.remove(
    "hidden"
  );

  createStages();

};


/* MOBILE CONTROLS */

function holdButton(element,key){

  element.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );

  element.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );

  element.addEventListener(
    "touchcancel",
    ()=>{
      keys[key]=false;
    }
  );

  element.addEventListener(
    "mousedown",
    ()=>{
      keys[key]=true;
    }
  );

  element.addEventListener(
    "mouseup",
    ()=>{
      keys[key]=false;
    }
  );

  element.addEventListener(
    "mouseleave",
    ()=>{
      keys[key]=false;
    }
  );

}

holdButton(
  document.getElementById("left"),
  "left"
);

holdButton(
  document.getElementById("right"),
  "right"
);

holdButton(
  document.getElementById("fire"),
  "fire"
);


/* KEYBOARD */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    )
      keys.left=true;

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    )
      keys.right=true;

    if(e.code==="Space")
      keys.fire=true;

  }
);


document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    )
      keys.left=false;

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    )
      keys.right=false;

    if(e.code==="Space")
      keys.fire=false;

  }
);


/* GAME LOOP */

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
