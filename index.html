<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TWISX SHOOTER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  touch-action: none;
}

body {
  overflow: hidden;
  background: #050816;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background:
    radial-gradient(circle at center, #101b38 0%, #050816 70%);
}

#ui {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 5;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 0 8px #00eaff;
}

#gameOver {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: rgba(0,0,0,.78);
  z-index: 10;
  text-align: center;
}

#gameOver h1 {
  font-size: 42px;
  color: #ff315a;
  text-shadow: 0 0 20px #ff315a;
  margin-bottom: 15px;
}

#finalScore {
  font-size: 22px;
  margin-bottom: 25px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 28px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: #00aaff;
  box-shadow: 0 0 20px #00aaff;
}

#controls {
  position: fixed;
  bottom: 25px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
  z-index: 6;
}

.control {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: rgba(0,170,255,.22);
  border: 2px solid #00aaff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 0 0 15px rgba(0,170,255,.6);
  user-select: none;
}

#fire {
  width: 90px;
  height: 90px;
  background: rgba(255,50,80,.25);
  border-color: #ff315a;
  box-shadow: 0 0 20px rgba(255,50,80,.7);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div>⭐ SCORE: <span id="score">0</span></div>
  <div>❤️ HP: <span id="hp">100</span></div>
</div>

<div id="controls">
  <div class="control" id="left">◀</div>
  <div class="control" id="fire">🔥</div>
  <div class="control" id="right">▶</div>
</div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <div id="finalScore">Score: 0</div>
  <button onclick="restartGame()">RESTART</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

let player;
let bullets = [];
let enemies = [];
let particles = [];
let score = 0;
let hp = 100;
let gameRunning = true;

let keys = {
  left: false,
  right: false,
  fire: false
};

function createPlayer() {
  player = {
    x: canvas.width / 2,
    y: canvas.height - 125,
    width: 45,
    height: 45,
    speed: 7,
    cooldown: 0
  };
}

createPlayer();

function shoot() {
  if (!gameRunning) return;

  if (player.cooldown <= 0) {
    bullets.push({
      x: player.x,
      y: player.y - 25,
      radius: 5,
      speed: 10
    });

    player.cooldown = 12;
  }
}

function spawnEnemy() {
  if (!gameRunning) return;

  enemies.push({
    x: Math.random() * (canvas.width - 50) + 25,
    y: -40,
    size: 30 + Math.random() * 15,
    speed: 1.5 + Math.random() * 2.5
  });
}

setInterval(spawnEnemy, 750);

function explosion(x, y) {
  for (let i = 0; i < 15; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - .5) * 7,
      vy: (Math.random() - .5) * 7,
      life: 30 + Math.random() * 20
    });
  }
}

function update() {
  if (!gameRunning) return;

  // Player movement
  if (keys.left) player.x -= player.speed;
  if (keys.right) player.x += player.speed;

  player.x = Math.max(25, Math.min(canvas.width - 25, player.x));

  if (player.cooldown > 0) player.cooldown--;

  if (keys.fire) shoot();

  // Bullets
  bullets.forEach(b => {
    b.y -= b.speed;
  });

  bullets = bullets.filter(b => b.y > -20);

  // Enemies
  enemies.forEach(e => {
    e.y += e.speed;
  });

  // Bullet vs enemy
  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];

    for (let j = bullets.length - 1; j >= 0; j--) {
      let bullet = bullets[j];

      let dx = enemy.x - bullet.x;
      let dy = enemy.y - bullet.y;
      let distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < enemy.size / 2 + bullet.radius) {
        explosion(enemy.x, enemy.y);

        enemies.splice(i, 1);
        bullets.splice(j, 1);

        score += 10;
        document.getElementById("score").textContent = score;

        break;
      }
    }
  }

  // Enemy reaches player
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];

    if (e.y > canvas.height - 100) {
      enemies.splice(i, 1);

      hp -= 20;
      hp = Math.max(0, hp);

      document.getElementById("hp").textContent = hp;

      if (hp <= 0) {
        endGame();
      }
    }
  }

  // Particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  particles = particles.filter(p => p.life > 0);
}

function drawBackground() {
  ctx.fillStyle = "#050816";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  for (let i = 0; i < 80; i++) {
    let x = (i * 97) % canvas.width;
    let y = (i * 53 + Date.now() * 0.02) % canvas.height;

    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillRect(x, y, 2, 2);
  }
}

function drawPlayer() {
  ctx.save();

  ctx.translate(player.x, player.y);

  ctx.shadowBlur = 20;
  ctx.shadowColor = "#00eaff";

  ctx.fillStyle = "#00eaff";

  ctx.beginPath();
  ctx.moveTo(0, -28);
  ctx.lineTo(-25, 25);
  ctx.lineTo(0, 15);
  ctx.lineTo(25, 25);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff";

  ctx.beginPath();
  ctx.arc(0, -8, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBullets() {
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);

    ctx.fillStyle = "#ffff00";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ffff00";

    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.save();

    ctx.translate(e.x, e.y);

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff315a";

    ctx.fillStyle = "#ff315a";

    ctx.beginPath();

    for (let i = 0; i < 6; i++) {
      let angle = i * Math.PI / 3;
      let x = Math.cos(angle) * e.size / 2;
      let y = Math.sin(angle) * e.size / 2;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-7, -3, 4, 0, Math.PI * 2);
    ctx.arc(7, -3, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = "#ffaa00";
    ctx.globalAlpha = p.life / 50;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

function draw() {
  drawBackground();
  drawBullets();
  drawEnemies();
  drawPlayer();
  drawParticles();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning = false;

  document.getElementById("finalScore").textContent =
    "Score: " + score;

  document.getElementById("gameOver").style.display = "flex";
}

function restartGame() {
  score = 0;
  hp = 100;

  bullets = [];
  enemies = [];
  particles = [];

  document.getElementById("score").textContent = "0";
  document.getElementById("hp").textContent = "100";

  createPlayer();

  document.getElementById("gameOver").style.display = "none";

  gameRunning = true;
}

// Keyboard controls
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    keys.left = true;

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    keys.right = true;

  if (e.code === "Space")
    keys.fire = true;
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    keys.left = false;

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    keys.right = false;

  if (e.code === "Space")
    keys.fire = false;
});

// Mobile buttons
function holdButton(element, property) {
  element.addEventListener("touchstart", e => {
    e.preventDefault();
    keys[property] = true;
  });

  element.addEventListener("touchend", e => {
    e.preventDefault();
    keys[property] = false;
  });

  element.addEventListener("touchcancel", () => {
    keys[property] = false;
  });

  element.addEventListener("mousedown", () => {
    keys[property] = true;
  });

  element.addEventListener("mouseup", () => {
    keys[property] = false;
  });

  element.addEventListener("mouseleave", () => {
    keys[property] = false;
  });
}

holdButton(document.getElementById("left"), "left");
holdButton(document.getElementById("right"), "right");
holdButton(document.getElementById("fire"), "fire");

gameLoop();
</script>

</body>
</html>
