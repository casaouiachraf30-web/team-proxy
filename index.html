<head>

<title>DRIP CLIENT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020611;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{padding:15px 5%;display:flex;justify-content:space-between;align-items:center;
background:#020611;border-bottom:1px solid #07518a;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:900;color:#00eaff;text-shadow:0 0 15px #00eaff}
.phone{color:#00eaff;text-decoration:none;font-weight:bold}
.hero{max-width:1400px;margin:auto;padding:15px}
.hero img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid #087cff;
box-shadow:0 0 30px rgba(0,170,255,.35)}
.products{max-width:1100px;margin:35px auto;padding:0 20px;display:grid;
grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#061329;border:1px solid #087cff;border-radius:16px;padding:25px;text-align:center}
.card:nth-child(2){border-color:#b22cff}
.card:nth-child(3){border-color:#ffc400}
.card h2{margin-bottom:18px;color:#00d9ff}
.card:nth-child(2) h2{color:#c85cff}
.card:nth-child(3) h2{color:#ffd000}
.price{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #17304c}
.buy{display:block;margin-top:20px;padding:13px;border-radius:10px;background:#007cff;
color:#fff;text-decoration:none;font-weight:bold}
footer{text-align:center;padding:30px;color:#71879a;border-top:1px solid #17304c}
@media(max-width:800px){.products{grid-template-columns:1fr}header{padding:12px 15px}.phone{font-size:13px}}
</style>
</head>
