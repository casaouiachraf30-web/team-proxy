<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ACHRAF_NAPOLI PARTY</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:none;
  user-select:none;
}

body{
  overflow:hidden;
  background:#080b18;
  font-family:Arial,sans-serif;
  color:white;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  background:linear-gradient(#111a38,#080b18);
}

.screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(3,5,15,.96);
  text-align:center;
}

.hidden{
  display:none!important;
}

.logo{
  font-size:38px;
  font-weight:900;
  color:#00eaff;
  text-shadow:0 0 20px #00eaff;
}

.subtitle{
  margin:10px 0 30px;
  color:#a9cfff;
  letter-spacing:3px;
}

.menuBtn{
  width:230px;
  padding:15px;
  margin:7px;
  border:2px solid #00cfff;
  border-radius:14px;
  background:#09203b;
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 0 15px #0077aa;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  font-size:15px;
  font-weight:bold;
}

#stage{
  position:fixed;
  top:38px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:#00eaff;
  font-weight:bold;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:15px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  padding:0 15px;
}

.playerControls{
  display:flex;
  gap:8px;
}

.control{
  width:62px;
  height:62px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  border:2px solid #00cfff;
  background:rgba(0,170,255,.2);
  font-size:25px;
  font-weight:bold;
}

.jump{
  border-color:#00ff9d;
  background:rgba(0,255,157,.15);
}

#finishScreen h1{
  font-size:42px;
  color:#ffd700;
  text-shadow:0 0 20px #ffd700;
  margin-bottom:15px;
}

.info{
  font-size:20px;
  margin:8px;
}

.smallBtn{
  padding:13px 25px;
  margin:6px;
  border:0;
  border-radius:12px;
  background:#00aaff;
  color:white;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MENU -->
<div id="menu" class="screen">

  <div class="logo">ACHRAF_NAPOLI</div>

  <div class="subtitle">PARTY BATTLE</div>

  <button class="menuBtn" id="play2">
    👥 PLAY 2 PLAYERS
  </button>

  <button class="menuBtn" id="play3">
    👥 PLAY 3 PLAYERS
  </button>

  <button class="menuBtn" id="play4">
    👥 PLAY 4 PLAYERS
  </button>

</div>

<!-- HUD -->
<div id="hud" class="hidden">

  <div id="score1">🔵 P1: 0</div>
  <div id="score2">🔴 P2: 0</div>
  <div id="score3">🟢 P3: 0</div>
  <div id="score4">🟡 P4: 0</div>

</div>

<div id="stage" class="hidden">
  STAGE 1
</div>

<!-- CONTROLS -->
<div id="controls" class="hidden">

  <div class="playerControls">
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>
    <div class="control jump" id="jump">⬆</div>
  </div>

</div>

<!-- FINISH -->
<div id="finishScreen" class="screen hidden">

  <h1>🏆 WINNER!</h1>

  <div class="info" id="winner"></div>
  <div class="info" id="scores"></div>

  <button class="smallBtn" id="nextStage">
    ▶ NEXT STAGE
  </button>

  <button class="smallBtn" id="backMenu">
    🏠 MENU
  </button>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}

resize();

addEventListener("resize",resize);


/* GAME */

let players=[];
let playerCount=2;
let currentStage=1;
let running=false;

let platforms=[];
let coins=[];
let finishX=0;


/* CONTROLS */

const keys={
  left:false,
  right:false,
  jump:false
};


/* START */

function startGame(count){

  playerCount=count;
  currentStage=1;

  createPlayers();
  createStage();

  document.getElementById("menu")
    .classList.add("hidden");

  document.getElementById("finishScreen")
    .classList.add("hidden");

  document.getElementById("hud")
    .classList.remove("hidden");

  document.getElementById("stage")
    .classList.remove("hidden");

  document.getElementById("controls")
    .classList.remove("hidden");

  running=true;

}


/* PLAYERS */

function createPlayers(){

  players=[];

  const colors=[
    "#00aaff",
    "#ff315a",
    "#00ff9d",
    "#ffd000"
  ];

  for(let i=0;i<playerCount;i++){

    players.push({

      id:i+1,

      x:80+i*55,

      y:canvas.height-150,

      vx:0,

      vy:0,

      size:30,

      speed:4+i*.15,

      jump:false,

      score:0,

      color:colors[i]

    });

  }

}


/* STAGE */

function createStage(){

  platforms=[];

  coins=[];

  const ground=canvas.height-80;

  platforms.push({
    x:0,
    y:ground,
    w:canvas.width*3,
    h:80
  });

  const count=7+currentStage*2;

  for(let i=0;i<count;i++){

    platforms.push({

      x:180+i*220,

      y:ground-100-(i%3)*45,

      w:130,

      h:20

    });

  }

  for(let i=0;i<count;i++){

    coins.push({

      x:230+i*220,

      y:ground-145-(i%3)*45,

      r:9,

      taken:false

    });

  }

  finishX=1800+currentStage*500;

  document.getElementById("stage")
    .textContent="STAGE "+currentStage;

}


/* PHYSICS */

function update(){

  if(!running)return;

  const ground=canvas.height-80;

  players.forEach((p,index)=>{

    p.vy+=0.7;

    p.x+=p.vx;

    p.y+=p.vy;

    p.vx*=0.82;


    /* Shared controls for first player */

    if(index===0){

      if(keys.left)
        p.vx=-p.speed;

      if(keys.right)
        p.vx=p.speed;

      if(keys.jump && !p.jump){

        p.vy=-12;

        p.jump=true;

      }

    }


    /* Ground */

    if(p.y+p.size/2>=ground){

      p.y=ground-p.size/2;

      p.vy=0;

      p.jump=false;

    }


    /* Platforms */

    platforms.forEach(pl=>{

      if(

        p.x>pl.x &&
        p.x<pl.x+pl.w &&
        p.y+p.size/2>=pl.y &&
        p.y+p.size/2<=pl.y+20 &&
        p.vy>=0

      ){

        p.y=pl.y-p.size/2;

        p.vy=0;

        p.jump=false;

      }

    });


    /* Coins */

    coins.forEach(c=>{

      if(c.taken)return;

      const dx=p.x-c.x;
      const dy=p.y-c.y;

      if(Math.sqrt(dx*dx+dy*dy)<28){

        c.taken=true;

        p.score+=10;

      }

    });


    /* Finish */

    if(p.x>=finishX){

      finishStage(p);

    }

  });

  updateHUD();

}


/* FINISH */

function finishStage(player){

  running=false;

  document.getElementById("finishScreen")
    .classList.remove("hidden");

  document.getElementById("hud")
    .classList.add("hidden");

  document.getElementById("stage")
    .classList.add("hidden");

  document.getElementById("controls")
    .classList.add("hidden");

  document.getElementById("winner")
    .textContent=
      "PLAYER "+player.id+" reached the finish!";

  document.getElementById("scores")
    .textContent=
      players.map(p=>"P"+p.id+": "+p.score).join(" • ");

}


/* HUD */

function updateHUD(){

  for(let i=0;i<4;i++){

    const el=document.getElementById(
      "score"+(i+1)
    );

    if(i<playerCount){

      el.style.display="block";

      el.textContent=
        "P"+(i+1)+": "+
        players[i].score;

    }else{

      el.style.display="none";

    }

  }

}


/* DRAW */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* background */

  ctx.fillStyle="#080b18";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* stars */

  for(let i=0;i<80;i++){

    const x=(i*97)%canvas.width;

    const y=(i*53)%canvas.height;

    ctx.fillStyle="rgba(255,255,255,.5)";

    ctx.fillRect(x,y,2,2);

  }


  /* camera */

  let cameraX=0;

  if(players[0])
    cameraX=Math.max(
      0,
      players[0].x-180
    );


  ctx.save();

  ctx.translate(-cameraX,0);


  /* platforms */

  platforms.forEach(pl=>{

    ctx.fillStyle="#17315b";

    ctx.fillRect(
      pl.x,
      pl.y,
      pl.w,
      pl.h
    );

  });


  /* coins */

  coins.forEach(c=>{

    if(c.taken)return;

    ctx.fillStyle="#ffd700";

    ctx.shadowBlur=12;
    ctx.shadowColor="#ffd700";

    ctx.beginPath();

    ctx.arc(
      c.x,
      c.y,
      c.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  });


  /* finish */

  ctx.fillStyle="#00ff9d";

  ctx.fillRect(
    finishX,
    canvas.height-220,
    10,
    140
  );


  ctx.font="bold 20px Arial";

  ctx.fillText(
    "FINISH",
    finishX-25,
    canvas.height-235
  );


  /* players */

  players.forEach(p=>{

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.fillStyle=p.color;

    ctx.shadowBlur=15;
    ctx.shadowColor=p.color;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      p.size/2,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#fff";

    ctx.font="bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "P"+p.id,
      0,
      5
    );

    ctx.restore();

  });


  ctx.restore();

}


/* NEXT STAGE */

document.getElementById(
  "nextStage"
).onclick=()=>{

  currentStage++;

  createPlayers();

  createStage();

  document.getElementById("finishScreen")
    .classList.add("hidden");

  document.getElementById("hud")
    .classList.remove("hidden");

  document.getElementById("stage")
    .classList.remove("hidden");

  document.getElementById("controls")
    .classList.remove("hidden");

  running=true;

};


/* MENU */

document.getElementById(
  "backMenu"
).onclick=()=>{

  document.getElementById("finishScreen")
    .classList.add("hidden");

  document.getElementById("menu")
    .classList.remove("hidden");

};


/* MENU BUTTONS */

document.getElementById("play2")
  .onclick=()=>startGame(2);

document.getElementById("play3")
  .onclick=()=>startGame(3);

document.getElementById("play4")
  .onclick=()=>startGame(4);


/* TOUCH */

function hold(id,key){

  const el=document.getElementById(id);

  el.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );

  el.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );

  el.addEventListener(
    "touchcancel",
    ()=>{
      keys[key]=false;
    }
  );

  el.addEventListener(
    "mousedown",
    ()=>{
      keys[key]=true;
    }
  );

  el.addEventListener(
    "mouseup",
    ()=>{
      keys[key]=false;
    }
  );

}

hold("left","left");
hold("right","right");
hold("jump","jump");


/* KEYBOARD */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      keys.left=true;

    if(e.key==="ArrowRight")
      keys.right=true;

    if(
      e.key==="ArrowUp" ||
      e.code==="Space"
    )
      keys.jump=true;

  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft")
      keys.left=false;

    if(e.key==="ArrowRight")
      keys.right=false;

    if(
      e.key==="ArrowUp" ||
      e.code==="Space"
    )
      keys.jump=false;

  }
);


/* LOOP */

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
